name: Build Binaries

on:
  push:
    paths:
      - 'install2.py'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx
          pip install --break-system-packages pyinstaller
      
      - name: Build x86_64 binary
        run: |
          pyinstaller \
            --onefile \
            --name install2 \
            --hidden-import=telegram \
            --hidden-import=telegram.ext \
            --hidden-import=telegram.ext.filters \
            --hidden-import=telegram.ext._application \
            --hidden-import=telegram.ext._commandhandler \
            --hidden-import=telegram.ext._callbackqueryhandler \
            --hidden-import=telegram.ext._messagehandler \
            --hidden-import=telegram._update \
            --hidden-import=telegram._inlinekeyboardbutton \
            --hidden-import=telegram._inlinekeyboardmarkup \
            --exclude-module=test \
            --exclude-module=unittest \
            --exclude-module=pytest \
            --exclude-module=doctest \
            --strip \
            install2.py
      
      - name: Verify binary size
        run: |
          SIZE=$(stat -c%s dist/install2)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -lt 16 ] || [ $SIZE_MB -gt 18 ]; then
            echo "ERROR: Binary size ${SIZE_MB}MB not in range 16-18MB"
            exit 1
          fi
      
      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: install2-x86_64
          path: dist/install2

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build ARM64 binary
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          file: Dockerfile.arm64
          push: false
          load: true
          tags: kighmu-arm64:latest
      
      - name: Extract ARM64 binary
        run: |
          docker create --name extract kighmu-arm64:latest
          docker cp extract:/build/dist/install2-arm64 ./install2-arm64.bin
          docker rm extract
      
      - name: Verify ARM64 binary size
        run: |
          SIZE=$(stat -c%s install2-arm64.bin)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "ARM64 Binary size: ${SIZE_MB}MB"
          if [ $SIZE_MB -lt 16 ] || [ $SIZE_MB -gt 18 ]; then
            echo "ERROR: ARM64 Binary size ${SIZE_MB}MB not in range 16-18MB"
            exit 1
          fi
      
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: install2-arm64
          path: install2-arm64.bin

  release:
    needs: [build-x86_64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: install2-x86_64
          path: .
      
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: install2-arm64
          path: .
      
      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp install2 install2.bin
          cp install2-arm64.bin install2-arm64.bin
          git add install2.bin install2-arm64.bin
          git commit -m "chore: update binaries [skip ci]" || echo "No changes"
          git push origin main
