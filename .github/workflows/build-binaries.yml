name: Build Binaries

on:
  push:
    paths:
      - 'install2.py'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf ccache file
          pip install nuitka==4.1.3 zstandard telegram
      - name: Build (Nuitka)
        run: |
          python3 -m nuitka \
            --standalone --onefile \
            --output-filename=install2.bin \
            --include-package=telegram \
            --lto=yes \
            --assume-yes-for-downloads \
            --jobs=4 \
            install2.py
      - name: Check size
        run: |
          ls -lh install2.bin
          file install2.bin | grep -q ELF && echo "ELF OK"
      - uses: actions/upload-artifact@v4
        with:
          name: install2-x86_64
          path: install2.bin

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf ccache file
          pip install nuitka==4.1.3 zstandard telegram
      - name: Build (Nuitka natif ARM64)
        run: |
          python3 -m nuitka \
            --standalone --onefile \
            --output-filename=install2-arm64.bin \
            --include-package=telegram \
            --lto=yes \
            --assume-yes-for-downloads \
            --jobs=4 \
            install2.py
      - name: Check size & arch
        run: |
          ls -lh install2-arm64.bin
          file install2-arm64.bin | grep -q "ARM aarch64" && echo "ARCH OK"
      - uses: actions/upload-artifact@v4
        with:
          name: install2-arm64
          path: install2-arm64.bin

  release:
    needs: [build-x86_64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: install2-x86_64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: install2-arm64
          path: .
      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install2.bin install2-arm64.bin
          git commit -m "chore: update binaries (nuitka) [skip ci]" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kinf744/fasto.git HEAD:main || true
